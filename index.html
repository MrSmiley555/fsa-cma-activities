<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>الدليل غير متاح مؤقتاً | Temporarily unavailable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#FBFBFD;--surface:#FFFFFF;--ink:#1D1D1F;--ink-2:#5F6670;--line:rgba(16,32,48,.10);--brand:#0B4F74;--gold:#A9823F;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0A0C0F;--surface:#171B20;--ink:#F2F3F5;--ink-2:#A7AEB8;--line:rgba(255,255,255,.10);--brand:#6DB3DC;--gold:#D3B074;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
main{max-width:560px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:40px 32px;text-align:center;display:grid;gap:14px}
.brand{font-size:14px;font-weight:700;color:var(--brand)}
.brand small{display:block;font-family:"IBM Plex Sans",sans-serif;font-weight:600;font-size:12px;color:var(--ink-2)}
.bar{width:48px;height:3px;background:var(--gold);border-radius:2px;margin:6px auto}
h1{margin:0;font-size:30px;line-height:1.3}
p{margin:0;color:var(--ink-2);line-height:1.7}
.en{direction:ltr;font-family:"IBM Plex Sans",sans-serif}
.en h1{font-size:22px}
hr{border:0;border-top:1px solid var(--line);margin:10px 0}
</style>
</head>
<body>
<main>
  <div class="brand">هيئة الخدمات المالية<small>Financial Services Authority</small></div>
  <div class="bar"></div>
  <h1>الدليل غير متاح مؤقتاً</h1>
  <p>نعمل حالياً على تحديث دليل ترخيص أنشطة سوق رأس المال، وسيعود قريباً.</p>
  <hr>
  <div class="en">
    <h1>Temporarily unavailable</h1>
    <p>The capital market activities licensing guide is being updated and will be back soon.</p>
  </div>
</main>
</body>
</html>
