<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="دليل تفاعلي لترخيص الجهات العاملة في مجال الأوراق المالية وفق اللائحة التنفيذية لقانون الأوراق المالية (خ/11/2026). Interactive licensing guide for Operating Entities in the securities field.">
<meta property="og:title" content="دليل ترخيص الجهات العاملة | Operating Entity Licensing Guide">
<meta property="og:description" content="الأنشطة، رأس المال، الرسوم، المستندات والالتزامات في مكان واحد. Activities, capital, fees, documents and obligations in one place.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0B4F74">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>دليل ترخيص الجهات العاملة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: Apple-style chapters — one calm column, full-bleed alternating bands, a sticky glass nav, and one strong interactive moment (the calculator). Bilingual: dir/lang switch on <html>. */
:root{
  --bg:#FBFBFD; --band:#F3F5F7; --surface:#FFFFFF; --ink:#1D1D1F; --ink-2:#5F6670; --ink-3:#8A9099;
  --line:rgba(16,32,48,.10); --brand:#0B4F74; --brand-soft:rgba(11,79,116,.08); --gold:#A9823F; --gold-soft:rgba(169,130,63,.12);
  --ok:#1F7A4D; --ok-soft:rgba(31,122,77,.10); --warn:#9A5B00; --warn-soft:rgba(154,91,0,.10);
  --glass:rgba(251,251,253,.78); --shadow:0 1px 2px rgba(16,32,48,.04),0 8px 28px rgba(16,32,48,.06);
  --f-ar:"IBM Plex Sans Arabic","SF Arabic","Segoe UI","Tahoma",sans-serif;
  --f-en:"IBM Plex Sans","SF Pro Text","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --r-lg:24px; --r-md:16px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0C0F; --band:#111418; --surface:#171B20; --ink:#F2F3F5; --ink-2:#A7AEB8; --ink-3:#7D848E;
  --line:rgba(255,255,255,.10); --brand:#6DB3DC; --brand-soft:rgba(109,179,220,.12); --gold:#D3B074; --gold-soft:rgba(211,176,116,.14);
  --ok:#5CC48D; --ok-soft:rgba(92,196,141,.12); --warn:#E0A84D; --warn-soft:rgba(224,168,77,.12);
  --glass:rgba(10,12,15,.72); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0C0F; --band:#111418; --surface:#171B20; --ink:#F2F3F5; --ink-2:#A7AEB8; --ink-3:#7D848E;
  --line:rgba(255,255,255,.10); --brand:#6DB3DC; --brand-soft:rgba(109,179,220,.12); --gold:#D3B074; --gold-soft:rgba(211,176,116,.14);
  --ok:#5CC48D; --ok-soft:rgba(92,196,141,.12); --warn:#E0A84D; --warn-soft:rgba(224,168,77,.12);
  --glass:rgba(10,12,15,.72); --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ar);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
html[lang="en"] body{font-family:var(--f-en);line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--glass)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band{background:var(--band)}
section{padding-block:88px}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:700;letter-spacing:-.01em}
html[lang="en"] h1,html[lang="en"] h2{letter-spacing:-.025em}
p{margin:0}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}

/* Nav */
nav.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid var(--line)}
nav.top .wrap{display:flex;align-items:center;gap:18px;height:52px}
.mark{display:flex;flex-direction:column;line-height:1.25;color:var(--ink);text-decoration:none;white-space:nowrap}
.mark b{font-size:14px;font-weight:700}
.mark small{font-size:10px;color:var(--ink-2);letter-spacing:.02em}
.links{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.links::-webkit-scrollbar{display:none}
.links a{font-size:13px;color:var(--ink-2);text-decoration:none;white-space:nowrap}
.links a:hover{color:var(--ink)}
.lang{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;font:inherit;font-size:13px;padding:5px 12px;cursor:pointer;white-space:nowrap;font-family:var(--f-en)}
html[lang="en"] .lang{font-family:var(--f-ar)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;font:inherit;font-weight:500;cursor:pointer;text-decoration:none;transition:transform .15s ease,background .2s}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--brand);color:var(--bg);padding:10px 22px;font-size:15px}
.btn-s{background:transparent;color:var(--brand);padding:10px 4px;font-size:15px}
.btn-s::after{content:"‹";font-size:18px;line-height:1}
html[dir="ltr"] .btn-s::after{content:"›"}
nav .btn-p{padding:6px 14px;font-size:13px;white-space:nowrap}
@media (max-width:520px){nav .btn-p{display:none}}

/* Hero */
.hero{padding-block:96px 72px;text-align:center}
.eyebrow{font-size:14px;font-weight:600;color:var(--gold);letter-spacing:.02em}
.hero h1{font-size:clamp(36px,6.4vw,68px);line-height:1.15;margin-top:14px}
.hero p.lead{font-size:clamp(17px,2.2vw,22px);color:var(--ink-2);max-width:660px;margin:20px auto 0;line-height:1.7}
.cta{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:32px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-radius:var(--r-lg);overflow:hidden;margin-top:64px;border:1px solid var(--line)}
.fact{background:var(--surface);padding:24px 16px;text-align:center}
.fact b{display:block;font-size:clamp(26px,3.4vw,36px);font-weight:600;letter-spacing:-.01em}
.fact span{font-size:13px;color:var(--ink-2)}
@media (max-width:720px){.facts{grid-template-columns:repeat(2,1fr)}}

/* Section head */
.sh{text-align:center;max-width:720px;margin:0 auto 48px}
.sh h2{font-size:clamp(30px,4.6vw,48px);line-height:1.2;margin-top:10px}
.sh p{color:var(--ink-2);font-size:18px;margin-top:14px}
.ref{display:inline-block;font-size:12px;font-weight:600;color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:1px 9px;white-space:nowrap;line-height:1.9}

/* Path */
.path{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.step{background:var(--surface);border-radius:var(--r-lg);padding:28px 24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.step .n{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--brand);color:var(--brand);display:grid;place-items:center;font-weight:600;font-size:15px}
.step h3{font-size:20px}
.step p{color:var(--ink-2);font-size:15px}
.step .ref{align-self:flex-start}
.step .clock{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);font-size:14px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.step .clock b{font-size:18px;color:var(--ink)}
@media (max-width:900px){.path{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.path{grid-template-columns:1fr}}
.note{margin-top:24px;display:flex;gap:12px;align-items:flex-start;background:var(--warn-soft);border-radius:var(--r-md);padding:16px 20px;font-size:15px}
.note b{color:var(--warn);flex:none}

/* Explorer */
.filters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:28px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 16px;font:inherit;font-size:14px;cursor:pointer;transition:background .2s,color .2s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:900px){.grid{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border-radius:var(--r-lg);padding:24px;border:1px solid var(--line);text-align:start;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:14px;transition:transform .2s ease,box-shadow .2s ease;min-width:0}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.card .cat{font-size:12px;color:var(--ink-3);font-weight:600}
.card h3{font-size:19px;line-height:1.45}
.card .desc{font-size:14px;line-height:1.65;color:var(--ink-2);margin:-4px 0 0}
.lead-desc{font-size:17px;line-height:1.7;color:var(--ink);margin-top:16px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card .kv{margin-top:auto}
.kv div{background:var(--band);border-radius:var(--r-sm);padding:10px 12px;min-width:0}
.kv small{display:block;font-size:12px;color:var(--ink-2)}
.kv strong{font-size:16px;font-weight:600}
.card .more{font-size:14px;color:var(--brand);display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--gold-soft);color:var(--gold)}
.card.bundle{background:linear-gradient(160deg,var(--brand-soft),var(--surface) 60%)}
.bundles-h{font-size:22px;margin:56px 0 16px;text-align:center}
.grid.two{grid-template-columns:1fr 1fr}
@media (max-width:640px){.grid.two{grid-template-columns:1fr}}

/* Dialog */
dialog{border:0;padding:0;border-radius:28px;max-width:640px;width:calc(100% - 32px);background:var(--surface);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.35);max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.4);backdrop-filter:blur(6px)}
.dlg{padding:32px;overflow-y:auto;max-height:88vh}
.dlg header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.dlg h3{font-size:26px;line-height:1.35}
.x{border:0;background:var(--band);color:var(--ink);width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
.dlg .kv{grid-template-columns:repeat(3,1fr);margin:22px 0}
@media (max-width:520px){.dlg{padding:24px}.dlg .kv{grid-template-columns:1fr 1fr}}
.dlg h4{font-size:15px;margin:22px 0 8px;color:var(--ink-2);font-weight:600}
.dlg ul{margin:0;padding-inline-start:20px;display:grid;gap:6px}
.dlg li{font-size:15px}
.dlg .acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.refs{display:flex;gap:6px;flex-wrap:wrap}

/* Calculator */
.calc{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:start}
@media (max-width:880px){.calc{grid-template-columns:1fr}}
.panel{background:var(--surface);border-radius:var(--r-lg);padding:24px;box-shadow:var(--shadow);min-width:0}
.seg{display:inline-flex;background:var(--band);border-radius:999px;padding:3px;gap:2px;width:100%}
.seg button{flex:1;border:0;background:transparent;font:inherit;font-size:14px;padding:8px 10px;border-radius:999px;cursor:pointer;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 6px;align-items:center;font-size:13px;color:var(--ink-2)}
.quick .chip{font-size:13px;padding:5px 12px}
.rows{display:grid;margin-top:8px}
.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row .t{font-size:15px;line-height:1.5;min-width:0}
.row .t small{display:block;color:var(--ink-3);font-size:12px}
.row.off{opacity:.42;cursor:not-allowed}
.sw{position:relative;width:46px;height:28px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:inherit}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:background .2s}
.sw span::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw input:checked+span{background:var(--ok)}
.sw input:checked+span::after{transform:translateX(-18px)}
html[dir="ltr"] .sw input:checked+span::after{transform:translateX(18px)}
.sw input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.sum{position:sticky;top:76px}
.sum .big{font-size:clamp(38px,5vw,52px);font-weight:600;letter-spacing:-.02em;line-height:1.1}
.sum .cur{font-size:16px;color:var(--ink-2);font-weight:500}
.sum .lbl{font-size:13px;color:var(--ink-2)}
.lines{display:grid;margin-top:20px;border-top:1px solid var(--line)}
.ln{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.ln span:first-child{color:var(--ink-2)}
.ln b{font-weight:600}
.ln.disc b{color:var(--ok)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--ok-soft);color:var(--ok)}
.tiers{display:flex;gap:4px;margin-top:16px}
.tiers div{flex:1;text-align:center;font-size:11px;padding:6px 0;border-radius:6px;background:var(--band);color:var(--ink-3);line-height:1.5}
.tiers div.on{background:var(--ok);color:var(--surface);font-weight:600}
.bundlehit{margin-top:14px;font-size:13px;background:var(--brand-soft);border-radius:var(--r-sm);padding:10px 12px}
.fine{font-size:12px;color:var(--ink-3);margin-top:14px;line-height:1.7}

/* Checklist */
.cl-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.cl-head .seg{width:auto;flex:1;max-width:600px}
.prog{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--ink-2)}
.bar{width:140px;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.items{display:grid}
.it{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;padding:16px 4px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.it:last-child{border-bottom:0}
.box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--ink-3);display:grid;place-items:center;margin-top:3px;transition:all .15s}
.it input{position:absolute;opacity:0;pointer-events:none}
.it input:checked~.box{background:var(--ok);border-color:var(--ok)}
.it input:checked~.box::after{content:"";width:6px;height:11px;border:solid var(--surface);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.it input:focus-visible~.box{outline:2px solid var(--brand);outline-offset:2px}
.it .txt{font-size:15px;min-width:0}
.it input:checked~.txt{color:var(--ink-3)}
details.sub{margin-top:8px}
details.sub summary{font-size:13px;color:var(--brand);cursor:pointer;list-style:none}
details.sub summary::-webkit-details-marker{display:none}
details.sub ol{margin:10px 0 0;padding-inline-start:22px;font-size:14px;color:var(--ink-2);display:grid;gap:4px}
.cl-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px;align-items:center}
.ghost{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:8px 16px;font:inherit;font-size:14px;cursor:pointer}
.ghost-row{display:flex;gap:8px;flex-wrap:wrap}

/* Rules */
.rules{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line)}
@media (max-width:700px){.rules{grid-template-columns:1fr}}
.rule{background:var(--surface);padding:26px 24px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.rule h3{font-size:18px}
.rule p{color:var(--ink-2);font-size:15px}

/* Obligations */
.ob{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:900px){.ob{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.ob{grid-template-columns:1fr}}
.obc{background:var(--surface);border-radius:var(--r-lg);padding:22px;border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;min-width:0}
.obc .when{font-size:13px;font-weight:600;color:var(--gold)}
.obc h3{font-size:17px;line-height:1.5}
.obc p{font-size:14px;color:var(--ink-2)}
.obc .ref{align-self:flex-start;margin-top:auto}
.freq{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:28px}

/* Review */
.review{display:grid;grid-template-columns:1fr 1fr;gap:0 32px;max-width:900px;margin:0 auto;padding:0;list-style:none}
@media (max-width:700px){.review{grid-template-columns:1fr}}
.review li{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px}
.review li::before{content:"✓";color:var(--ok);font-weight:700}

/* Regulations */
.docs{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:880px;margin:0 auto}
@media (max-width:640px){.docs{grid-template-columns:1fr}}
.doc{display:grid;grid-template-columns:96px 1fr;gap:20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;text-decoration:none;color:inherit;transition:transform .2s ease,box-shadow .2s ease;min-width:0}
.doc:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.cover{aspect-ratio:3/4;border-radius:8px;background:linear-gradient(170deg,var(--brand),color-mix(in srgb,var(--brand) 70%,#000));color:#fff;padding:10px 9px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 8px 18px rgba(0,0,0,.18);position:relative;overflow:hidden}
.cover::before{content:"";position:absolute;inset:auto -20% -30% auto;width:90%;aspect-ratio:1;border-radius:50%;background:var(--gold);opacity:.35}
.cover b{font-size:9px;line-height:1.35;position:relative;font-weight:600}
.cover span{font-size:8px;opacity:.8;position:relative}
.doc h3{font-size:18px}
.doc p{font-size:13px;color:var(--ink-2);margin-top:4px}
.doc .open{margin-top:12px;font-size:14px;color:var(--brand);font-weight:500}
.keyarts{margin:28px auto 0;text-align:center;font-size:14px;color:var(--ink-2);display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}

/* Contact */
.contact{max-width:640px;margin:0 auto;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:28px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
@media (max-width:520px){.contact{grid-template-columns:1fr;text-align:center;justify-items:center}}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:24px}
.contact h3{font-size:20px}
.contact .role{font-size:14px;color:var(--ink-2)}
.mail{display:inline-block;margin-top:8px;font-family:var(--f-en);font-size:15px;user-select:all;direction:ltr;unicode-bidi:isolate;word-break:break-all}
.contact .ghost-row{margin-top:12px}
@media (max-width:520px){.contact .ghost-row{justify-content:center}}

/* Final + footer */
.final{text-align:center}
.final h2{font-size:clamp(30px,4.6vw,48px)}
.final p{color:var(--ink-2);font-size:18px;margin:14px auto 0;max-width:560px}

 {id:"cus",n:{ar:"الحفظ والأمانة",en:"Custodian"},c:"cus",cap:3000000,fee:5000,ren:3000,art:"38/1",f:false,
  inc:{ar:["الاحتفاظ بالأوراق المالية والأموال الخاصة بالمتعاملين في حسابات منفصلة.","ضمان حفظ وسلامة الأوراق المالية والحقوق المرتبطة بها، كتسلم الأرباح والتصويت والاكتتاب.","ضمان دقة التعاملات التي تنفذها الجهة المرخصة في نشاط الوساطة.","تسلم وحفظ ودفع أموال المتعاملين لتسوية التعاملات.","تزويد المتعامل بتقارير دورية عن محافظه وحساباته النقدية (م59)."],en:["Holding consumers' securities and funds in separate accounts.","Safekeeping securities and their attached rights, such as dividends, voting and subscription.","Ensuring the accuracy of transactions executed by brokerage-licensed entities.","Receiving, holding and paying consumers' funds to settle transactions.","Providing consumers with periodic reports on their portfolios and cash accounts (Art. 59)."]},a2:{ar:"المادتان 58 و59",en:"Articles 58–59"}},
 {id:"str",n:{ar:"هيكلة المنتجات",en:"Product structuring"},c:"inv",cap:1000000,fee:15000,ren:10000,art:"38/2",f:false,
  inc:{ar:["استحداث وإدارة وتوزيع منتجات مهيكلة مبنية على أوراق مالية أو مؤشرات أو أي منتج يمكن أن يطرح ويتداول في أي بورصة.","يجوز لها استحداث شركات ذات غرض خاص (SPV) واستخدام أدوات الرفع المالي والتوريق."],en:["Developing, managing and distributing structured products based on securities, indices or any product that may be offered and traded on a stock exchange.","May establish special purpose vehicles (SPVs) and use financial leverage and securitization tools."]},note:{ar:"مع مراعاة الضوابط الصادرة عن البنك المركزي العماني في مجال توريق القروض.",en:"Taking into account the Central Bank of Oman's regulations on loan securitization."},a2:{ar:"المادة 70",en:"Article 70"}},
 {id:"pm",n:{ar:"إدارة محافظ الأوراق المالية",en:"Securities portfolio management"},c:"inv",cap:200000,fee:10000,ren:5000,art:"38/3",f:false,
  inc:{ar:["تكوين محافظ الأوراق المالية للأفراد والأشخاص الاعتبارية وتخصيص الأصول وفق سياسة الاستثمار المعتمدة مع المتعامل.","إدارة محافظ العملاء الأفراد والمؤسسات ومتابعة تنفيذ أوامر البيع والشراء.","إدارة محافظ صناديق التقاعد أو صناديق الثروة السيادية.","إدارة حسابات العهدة، وإعادة توازن المحفظة."],en:["Establishing portfolios for individuals and legal persons and allocating assets per the investment policy agreed with the consumer.","Managing individual and institutional client portfolios and monitoring order execution.","Managing portfolios of pension funds or sovereign wealth funds.","Managing trust accounts and rebalancing portfolios."]},note:{ar:"يلزم إبرام عقد مع المتعامل وفق النموذج الذي تعده الهيئة (م61/3).",en:"A contract with the consumer on the FSA's prescribed form is required (Art. 61/3)."},a2:{ar:"المادتان 60 و61",en:"Articles 60–61"}},
 {id:"fa",n:{ar:"إدارة صناديق الاستثمار الجماعي",en:"Collective investment fund management"},c:"inv",cap:200000,fee:10000,ren:5000,art:"38/4",f:false,
  inc:{ar:["الإجراءات المتعلقة بإصدار واسترداد الوحدات الاستثمارية.","حفظ وتحديث سجلات الصندوق، وإدارة حوكمته، وعمليات المكتب الخلفي.","حساب صافي قيمة الأصول وسعر الإصدار والاسترداد (م63).","مراقبة عملية حل أو تصفية الصندوق."],en:["Procedures for issuing and redeeming investment units.","Maintaining the fund's records, managing its governance and back-office operations.","Calculating NAV and the issue and redemption prices (Art. 63).","Monitoring the dissolution or liquidation of the fund."]},a2:{ar:"المادتان 62 و63",en:"Articles 62–63"}},
 {id:"im",n:{ar:"مدير الاستثمار",en:"Investment manager"},c:"inv",cap:200000,fee:10000,ren:5000,art:"38/5",f:false,

 {id:"iss",n:{ar:"إدارة الإصدارات",en:"Issue management"},c:"cap",cap:200000,fee:15000,ren:5000,art:"38/6",f:true,
  inc:{ar:["تولي مهام الإصدارات الأولية والمسؤولية أمام الهيئة عن استيفاء متطلباتها حتى الإدراج.","إعداد نشرة الإصدار وتقديمها للهيئة، والجهة مسؤولة عما تحويه من بيانات.","إدارة وتنظيم عملية إصدار الأوراق المالية.","تقديم المشورة للمصدرين بشأن هيكلة الإصدارات والاستحواذ والاندماج وشروط الطرح."],en:["Undertaking initial issuance duties and being responsible to the FSA for meeting their requirements until listing.","Preparing the Prospectus and submitting it to the FSA; the entity is responsible for its contents.","Managing and organizing the securities issuance process.","Advising issuers on issue structuring, acquisitions, mergers and offering terms."]},a2:{ar:"المادة 65",en:"Article 65"}},
 {id:"rs",n:{ar:"البحث وتقديم المشورة المتعلقة بالاستثمار في الأوراق المالية المدرجة",en:"Research and advice related to investment in listed securities"},c:"cap",cap:200000,fee:10000,ren:5000,art:"38/7",f:true,
  inc:{ar:["تقييم الأوراق المالية.","إعداد ونشر تقارير الدراسات والبحوث والتقارير المالية التحليلية.","تقديم خدمة الأخبار المالية.","تقديم المشورة بشأن الاحتفاظ بأوراق مالية مدرجة أو شرائها أو بيعها أو الاكتتاب فيها."],en:["Valuing securities.","Preparing and publishing studies, research and analytical financial reports.","Providing a financial news service.","Advising on holding, buying, selling or subscribing to listed securities."]},note:{ar:"لا يجوز لها تسلم أي أموال من المتعاملين مقابل استثماراتهم (م67/6). ولا يُعد من النشاط النشر الإعلامي العام غير المقرون بتوصية (م68).",en:"It may not receive any funds from consumers for their investments (Art. 67/6). General media publication not accompanied by a trading recommendation is not part of this activity (Art. 68)."},a2:{ar:"المواد 66 إلى 68",en:"Articles 66–68"}},
 {id:"mk",n:{ar:"تسويق أوراق مالية غير عمانية",en:"Marketing of non-Omani securities"},c:"cap",cap:200000,fee:15000,ren:10000,art:"38/8",f:true,
  inc:{ar:["التسويق وتقديم المشورة بشأن أوراق مالية ومنتجات تصدر عن جهات من خارج سلطنة عمان ومنظمة من هيئات رقابية أعضاء في IOSCO.","التسويق للمتعاملين من ذوي الخبرة في أسواق الأوراق المالية فقط، مع إثبات ذلك.","عدم استخدام وسائل الإعلام للتسويق، وعدم تسلم أي أموال من المتعاملين."],en:["Marketing and advising on securities and products issued outside Oman and regulated by IOSCO-member regulators.","Marketing only to consumers experienced in securities markets, with evidence of that experience.","Not using the media for marketing, and not receiving any funds from consumers."]},note:{ar:"تقدم بياناً سنوياً للهيئة وفق النموذج المعد (م82). ويستثنى ما يصدر في دول مجلس التعاون في اكتتاب عام.",en:"Submits an annual statement to the FSA on the prescribed form (Art. 82). Securities issued through public offerings in GCC states are excepted."},a2:{ar:"المادتان 69 و82",en:"Articles 69, 82"}},
 {id:"ag",n:{ar:"وكيل حملة السندات أو ملاك الصكوك ووحدات الصناديق",en:"Agent for bondholders, Sukukholders or unitholders"},c:"cus",cap:200000,fee:5000,ren:3000,art:"38/9",f:false,
  inc:{ar:["مراقبة تنفيذ الجهة المصدرة أو المستفيدة وشركة الغرض الخاص لالتزاماتها الواردة في نشرة الإصدار.","التأكد من دفع العوائد المستحقة في تاريخ الاستحقاق، ومتابعة كفاية الضمانات.","تمثيل حملة السندات أو ملاك الصكوك ورئاسة اجتماعات جمعيتهم العامة."],en:["Monitoring the issuer or beneficiary and the SPV in fulfilling their Prospectus obligations.","Ensuring returns are paid on the due date and monitoring the adequacy of guarantees.","Representing bondholders or Sukukholders and chairing their general assembly meetings."]},note:{ar:"يذكر ملحق الرسوم هذا النشاط باسم «وكيل حملة السندات أو ملاك الصكوك».",en:"The Fees Annex lists this activity as “Agent for bondholders or Sukukholders”."},a2:{ar:"المادة 71",en:"Article 71"}}

function bundleTotals(b){const acts=b.ids.map(i=>byId[i]);const k=acts.length,d=discount(k);return{acts,k,d,cap:acts.reduce((s,a)=>s+a.cap,0),feeRaw:acts.reduce((s,a)=>s+a.fee,0),renRaw:acts.reduce((s,a)=>s+a.ren,0),fee:acts.reduce((s,a)=>s+a.fee,0)*(1-d/100),ren:acts.reduce((s,a)=>s+a.ren,0)*(1-d/100)}}

 B.forEach(b=>{const c=document.createElement("button");c.type="button";c.className="chip";c.textContent=L(b.n);c.dataset.q=b.id;c.onclick=()=>{b.ids.forEach(i=>sel.add(i));drawCalc()};q.appendChild(c)});
 const clr=document.createElement("button");clr.type="button";clr.className="chip";clr.textContent=ar?"مسح الاختيار":"Clear";clr.onclick=()=>{sel.clear();drawCalc()};q.appendChild(clr);
 $("rows").innerHTML=A.map(a=>`<label class="row" data-r="${a.id}"><span class="t">${esc(L(a.n))}<small class="num">${ar?"رأس المال":"Capital"} ${fmt(a.cap)} · ${ar?"ترخيص":"License"} ${fmt(a.fee)} · ${ar?"تجديد":"Renewal"} ${fmt(a.ren)}</small></span><span class="sw"><input type="checkbox" id="c-${a.id}" aria-label="${esc(L(a.n))}"><span></span></span></label>`).join("");
 A.forEach(a=>{$("c-"+a.id).onchange=e=>{e.target.checked?sel.add(a.id):sel.delete(a.id);drawCalc()}})}
function setType(t){type=t;$("t-nat").setAttribute("aria-pressed",t==="nat");$("t-for").setAttribute("aria-pressed",t==="for");if(t==="for")A.forEach(a=>{if(!a.f)sel.delete(a.id)});drawCalc()}
$("t-nat").onclick=()=>setType("nat");$("t-for").onclick=()=>setType("for");
function drawCalc(){const ar=lang==="ar";
 A.forEach(a=>{const cb=$("c-"+a.id),r=document.querySelector(`[data-r="${a.id}"]`);const dis=type==="for"&&!a.f;cb.disabled=dis;r.classList.toggle("off",dis);r.title=dis?(ar?"غير متاح لفروع الشركات الأجنبية (م41)":"Not available to foreign branches (Art. 41)"):"";cb.checked=sel.has(a.id)});
 document.querySelectorAll("[data-q]").forEach(c=>c.disabled=type==="for");
 const acts=[...sel].map(i=>byId[i]);const k=acts.length,d=discount(k);
 const lic=acts.reduce((s,a)=>s+a.fee,0),ren=acts.reduce((s,a)=>s+a.ren,0),cap=acts.reduce((s,a)=>s+a.cap,0);
 const disc=lic*d/100,study=k?500:0,bg=type==="for"?50000:Math.min(15000,Math.max(2000,cap*0.01));
 $("s-total").textContent=fmt(lic-disc+study);
 $("s-count").textContent=!k?(ar?"اختر نشاطاً أو أكثر لتظهر لك التكلفة":"Choose one or more activities to see the cost"):ar?`${k===1?"نشاط واحد":k===2?"نشاطان":k<=10?k+" أنشطة":k+" نشاطاً"}${d?` · خصم ${d}%`:" · لا خصم دون 3 تراخيص"}`:`${k} ${k===1?"activity":"activities"}${d?` · ${d}% discount`:" · no discount below 3 licenses"}`;
 $("s-study").textContent=fmt(study);$("s-lic").textContent=fmt(lic);
 $("s-dlbl").innerHTML=`${ar?"خصم تعدد التراخيص":"Multi-license discount"} ${d?`<span class="pill num">${d}%</span>`:""}`;
 $("s-disc").textContent=disc?"− "+fmt(disc):"0";$("s-ren").textContent=fmt(ren*(1-d/100));$("s-cap").textContent=fmt(cap);$("s-bg").textContent=k?fmt(bg):"0";
 $("s-parent-row").hidden=type!=="for";
 [...$("tiers").children].forEach((el,i)=>el.classList.toggle("on",(i===0&&k>0&&k<3)||(i===1&&k===3)||(i===2&&k===4)||(i===3&&k>=5&&k<=6)||(i===4&&k>=7&&k<=8)||(i===5&&k>=9)));
 const hits=B.filter(b=>b.ids.every(i=>sel.has(i)));const bh=$("s-bundle");
 if(hits.length&&type==="nat"){bh.hidden=false;bh.textContent=ar?`اختيارك يشمل الأنشطة المكوّنة لـ: ${hits.map(b=>L(b.n)).join(" و")}، وتُحتسب بمجموعها.`:`Your selection covers all components of ${hits.map(b=>L(b.n)).join(" and ")}, calculated as their sum.`}else bh.hidden=true;
 $("s-fine").textContent=type==="for"
  ?(ar?"يُطبق على الفرع الحد الأدنى لرأس المال عن كل نشاط (م38)، ويشترط كذلك ألا يقل رأس مال الجهة الأم المدفوع وحقوق مساهميها عن 2,000,000 ر.ع (م44). الضمان المصرفي 50,000 ر.ع (م44/5-ب). رسم دراسة الطلب لا يدخل في الخصم.":"The per-activity minimum capital applies to the branch (Art. 38), and the parent's paid-up capital and shareholders' equity must be at least OMR 2,000,000 (Art. 44). Bank guarantee: OMR 50,000 (Art. 44/5-b). The review fee is not discounted.")
  :(ar?"الضمان المصرفي 1% من رأس المال المطلوب، بحد أدنى 2,000 وأقصى 15,000 ر.ع للشركة الوطنية (م44/5)، ومحسوب هنا على الحد الأدنى لرأس المال. رسم دراسة الطلب (500 ر.ع) يُسدد مرة واحدة ولا يدخل في الخصم، ويطبق الخصم ذاته على رسوم التجديد.":"Bank guarantee: 1% of the required capital, minimum OMR 2,000 and maximum OMR 15,000 for a national company (Art. 44/5), calculated here on the minimum capital. The OMR 500 review fee is paid once and is not discounted; the same discount applies to renewal fees.");
}

/* Checklist */
function drawCL(){const ar=lang==="ar",Ls=CL[tab].items;
 $("cl-items").innerHTML=Ls.map((it,i)=>{const id=`${tab}-${i}`;return `<label class="it" for="k-${id}"><input type="checkbox" id="k-${id}" ${st[id]?"checked":""}><span class="box" aria-hidden="true"></span><span class="txt">${esc(L(it[1]))}${it[2]?`<details class="sub"><summary>${ar?"عرض اللوائح والسياسات المطلوبة (15)":"Show the 15 required regulations and policies"}</summary><ol>${ART5[lang].map(x=>`<li>${esc(x)}</li>`).join("")}</ol></details>`:""}</span>${R(m(L(it[0])))}</label>`}).join("");
 $("cl-items").querySelectorAll("input").forEach(cb=>cb.onchange=()=>{st[cb.id.slice(2)]=cb.checked;save();prog()});
 $("cl-items").querySelectorAll("details").forEach(d=>d.addEventListener("click",e=>e.stopPropagation()));prog()}
function prog(){const Ls=CL[tab].items,done=Ls.filter((_,i)=>st[`${tab}-${i}`]).length;$("cl-count").textContent=`${done} / ${Ls.length}`;$("cl-bar").style.width=(done/Ls.length*100)+"%"}
$("cl-reset").onclick=()=>{Object.keys(st).filter(k=>k.startsWith(tab)).forEach(k=>delete st[k]);save();drawCL()};
function copyText(txt,btn,ok,orig){const fail=()=>{btn.textContent=lang==="ar"?"تعذر النسخ":"Couldn't copy";setTimeout(()=>btn.textContent=orig(),1800)};try{navigator.clipboard.writeText(txt).then(()=>{btn.textContent=ok;setTimeout(()=>btn.textContent=orig(),1800)},fail)}catch(e){fail()}}
$("cl-copy").onclick=e=>{const Ls=CL[tab].items;const txt=L(CL[tab].l)+"\n"+Ls.map((it,i)=>`${st[`${tab}-${i}`]?"☑":"☐"} ${L(it[1])} (${m(L(it[0]))})`).join("\n");copyText(txt,e.currentTarget,lang==="ar"?"نُسخت القائمة":"Copied",()=>L(T.d_copy))};
$("mail-copy").onclick=e=>{copyText("nabras.alkhanjari@fsa.gov.om",e.currentTarget,lang==="ar"?"نُسخ البريد":"Copied",()=>L(T.k_copy));try{const r=document.createRange();r.selectNodeContents($("mail"));const s=getSelection();s.removeAllRanges();s.addRange(r)}catch(_){}};

/* Obligations */
function drawOB(){$("ob").innerHTML=OB.filter(o=>fq==="all"||o[0]===fq).map(o=>`<article class="obc"><div class="when">${L(o[1])}</div><h3>${L(o[2])}</h3><p>${L(o[3])}</p>${R(art(o[4]))}</article>`).join("")}

$("lang").onclick=()=>{lang=lang==="ar"?"en":"ar";try{localStorage.setItem("fsa-lang",lang)}catch(e){}if(dlg.open)dlg.close();drawStatic()};
drawStatic();
})();
</script>
